version: '3.8'

services:
  proxi-server:
    build:
      context: ./src-vpn
      dockerfile: Dockerfile
    ports:
      - "9999:9999"
    environment:
      - PORT=9999
      - DIST_DIR=/app/dist
      - DATA_DIR=/data
    volumes:
      - proxi-data:/data
      - ./dist:/app/dist:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9999/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: IPFS node for file storage
  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs-data:/data/ipfs
    restart: unless-stopped
    profiles:
      - ipfs

  # Optional: Tor proxy for .onion connections
  tor:
    image: dperson/torproxy:latest
    ports:
      - "9050:9050"
      - "9051:9051"
    restart: unless-stopped
    profiles:
      - tor

volumes:
  proxi-data:
  ipfs-data:
