version: "3.8"

services:
  messenger:
    build: .
    container_name: unkillable-messenger
    ports:
      - "8090:8080"   # Web UI
      - "51820:51820/udp"  # WireGuard VPN
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - vpn-data:/root/.unkillable-vpn
    restart: unless-stopped

volumes:
  vpn-data:
