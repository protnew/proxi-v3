name: proxi_messenger
description: Proxi Messenger — decentralized E2E encrypted messenger
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  web_socket_channel: ^2.4.5
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^17.1.2
  pointycastle: ^3.9.1
  path_provider: ^2.1.3
  intl: ^0.19.0
  file_picker: ^8.0.3
  audioplayers: ^6.0.0
  record: ^5.0.5
  permission_handler: ^11.3.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
