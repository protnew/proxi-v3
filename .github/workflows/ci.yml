name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Go backend tests ───
  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/src-vpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -v -count=1

  # ─── PWA unit tests (Vitest) ───
  pwa-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/pwa-vpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototypes/pwa-vpn/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run

  # ─── PWA build artifact ───
  pwa-build:
    runs-on: ubuntu-latest
    needs: [pwa-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: prototypes/pwa-vpn/package-lock.json
      - name: Build PWA
        working-directory: prototypes/pwa-vpn
        run: |
          npm ci
          npm run build
      - name: Verify dist
        working-directory: prototypes/pwa-vpn
        run: |
          test -f dist/index.html && echo "PWA build OK"
          # glob expands to many files — check the first exists and is non-empty
          set -- dist/assets/*.js
          if [ "$#" -ge 1 ] && [ -f "$1" ] && [ -s "$1" ]; then echo "JS bundle OK ($# files)"; else echo "no JS bundle" >&2; exit 1; fi
