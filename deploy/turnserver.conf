# coturn TURN server config for Indestructible VPN
# Architecture table 05_Relay_Architecture: self-hosted coturn on VPS $5/mo
#
# Deploy: ssh root@your-vps "apt install coturn && cp turnserver.conf /etc/turnserver.conf && systemctl restart coturn"
#
# Set your VPS IP below:

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=YOUR_VPS_IP

# Long-term credentials (WebRTC uses time-limited credentials)
user=proxi:changeme_strong_password_here
realm=indestructible.vpn
server-name=indestructible-turn

# Fingerprint in TURN responses
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Total quota
total-quota=100

# Max bytes per session
bps-capacity=0

# Log
log-file=/var/log/turnserver.log
simple-log

# Disable CLI
no-cli

# Allow only DTLS/UDP (WebRTC uses these)
no-tcp-relay
